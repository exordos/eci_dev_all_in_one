# Build section. It specifies the build process of the project
build:

  # Dependencies of the project
  deps:
      # Target path in the image
    - dst: /opt/exordos-realm
      # Local path
      path:
        src: ../../gci_dev_all_in_one
      exclude:
        - .git
        - output

  # List of elements in the project
  elements:
    - manifest: manifests/exordos_realm.yaml
      # List of images in the element
      images:
      - name: exordos-realm
        format: zst
        envs:
          # Exordos core element version to bake into the image.
          # Defaults to the latest stable version in the public repo.
          - CORE_VERSION
          # Set to "1" for developer builds to enable ubuntu:ubuntu
          # console/ssh access.
          - DEV_ACCESS
          # Override the exordos CLI installer URL (local testing).
          - EXORDOS_INSTALL_URL

        # OS profile for the image. exordos_base builds on the exordos-base
        # image, which ships the universal agent — required to receive the
        # realm spec config from the parent realm. (The exordos_custom
        # profile targets the same base but is not shipped by the released
        # exordos CLI; all other elements use exordos_base too.)
        profile: exordos_base

        # Provisioning script
        script: images/install.sh
        override:
          disk_size: "20G"
          memory: 8192
          cpus: 2
