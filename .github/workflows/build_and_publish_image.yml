name: packer

on:
  push:
  workflow_dispatch:
  schedule:
    # Generate new release at 00:00 on Sunday.
    - cron: "0 0 * * 0"

env:
  PACKER_VERSION: "latest"
  # Exordos core element version baked into the image
  # (empty = latest stable in the public repo).
  CORE_VERSION: ""

# TODO: we may create separate `publish` job in future
permissions:
  contents: write

jobs:
  build_n_publish:
    runs-on: ubuntu-latest
    name: Build Image
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup `packer`
        uses: hashicorp/setup-packer@main
        with:
          version: ${{ env.PACKER_VERSION }}
      - name: Set up QEMU
        run: |
          sudo apt -y update
          sudo apt install -y qemu-system-amd64 qemu-kvm qemu-utils libvirt-daemon-system libvirt-dev mkisofs zip
          sudo adduser $USER libvirt
          sudo adduser $USER kvm
          sudo chmod +666 /dev/kvm
      - name: Build image
        run: |
          ./build.sh
      - name: Collect artifacts
        run: |
          mkdir ./packed
          RAW_GZ=$(find output -name 'exordos-realm.raw.gz' | head -1)
          cp "$RAW_GZ" ./packed/exordos-realm.raw.gz
          # qcow2 for manual/developer usage
          gunzip -k ./packed/exordos-realm.raw.gz
          qemu-img convert -O qcow2 ./packed/exordos-realm.raw ./packed/exordos-realm.qcow2
          rm ./packed/exordos-realm.raw
          gzip --best ./packed/exordos-realm.qcow2
          # Show image sizes
          ls -la ./packed/
      - name: Save artifact raw
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: raw image
          path: ./packed/exordos-realm.raw.gz
          compression-level: 0
      - name: Save artifact qcow2
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: qcow2 image
          path: ./packed/exordos-realm.qcow2.gz
          compression-level: 0
      - name: Set current date as env variable
        id: date
        run: |
          r=$(date -u +'%Y.%m.%d')
          echo "DATE=$r" >> $GITHUB_OUTPUT
      - name: Publish image (for master branch only)
        if: github.ref == 'refs/heads/master'
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ./packed/*
          tag: ${{ github.ref }}
          release_name: ${{ steps.date.outputs.DATE }}
          overwrite: true
          file_glob: true
