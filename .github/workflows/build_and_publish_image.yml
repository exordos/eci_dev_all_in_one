name: build_publish

on:
  push:
  workflow_dispatch:
  schedule:
    # Generate new release at 00:00 on Sunday.
    - cron: "0 0 * * 0"

env:
  PACKER_VERSION: "1.9.2"
  # Exordos core element version baked into the image
  # (empty = latest stable in the public repo).
  INVENTORY: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: [self-hosted, vm]
    if: ${{ github.actor != 'dependabot[bot]' }}
    name: Build realm image
    strategy:
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Build image
        env:
          DEV_ACCESS: 1
        run: exordos build -f . "$@"
      - name: Publish exordos-realm to repo.exordos.com
        env:
          PUSH_CFG: ${{ secrets.PUSH_CFG }}
        run: |
          echo "$PUSH_CFG" | base64 -d > exordos/exordos.push.yaml
          exordos push -c exordos/exordos.push.yaml -t local -f --latest