name: build_publish

on:
  push:
  workflow_dispatch:
  schedule:
    # Generate new release at 00:00 on Sunday.
    - cron: "0 0 * * 0"

env:
  PACKER_VERSION: "1.9.2"
  # Exordos core element version baked into the image
  # (empty = latest stable in the public repo).
  INVENTORY: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: [self-hosted, vm]
    if: ${{ github.actor != 'dependabot[bot]' }}
    name: Build realm image
    strategy:
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Tag scheduled release
        if: github.event_name == 'schedule'
        shell: bash
        run: |
          git fetch origin --tags
          latest_tag=$(git tag --list | sort -V | awk '/^[0-9]+\.[0-9]+\.[0-9]+$/ { tag = $0 } END { print tag }')
          IFS=. read -r major minor patch <<< "${latest_tag:-0.0.0}"
          next_tag="$major.$minor.$((10#$patch + 1))"
          git tag "$next_tag" HEAD
          git push origin "refs/tags/$next_tag"
      - name: Build image
        env:
          DEV_ACCESS: 1
        run: exordos build -f . "$@"
      - name: Publish exordos-realm to repo.exordos.com
        env:
          PUSH_CFG: ${{ secrets.PUSH_CFG }}
        run: |
          echo "$PUSH_CFG" | base64 -d > exordos/exordos.push.yaml
          exordos push -c exordos/exordos.push.yaml -t local -f --latest
