name: build_publish

on:
  push:
  workflow_dispatch:
  schedule:
    # Generate new release at 00:00 on Sunday.
    - cron: "0 0 * * 0"

env:
  PACKER_VERSION: "1.9.2"
  # Exordos core element version baked into the image
  # (empty = latest stable in the public repo).
  CORE_VERSION: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: [self-hosted, vm]
    if: ${{ github.actor != 'dependabot[bot]' }}
    name: Build ${{ matrix.variant }} image
    strategy:
      fail-fast: false
      matrix:
        include:
          # Production node image used by the ecosystem builder (no console).
          - variant: prod
            dev_access: ""
            artifact_base: exordos-realm
          # Developer stand: DEV_ACCESS=1 enables ubuntu:ubuntu access.
          - variant: dev
            dev_access: "1"
            artifact_base: exordos-realm-dev
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Build image
        env:
          DEV_ACCESS: ${{ matrix.dev_access }}
        run: exordos build -f . "$@"
      - name: Publish exordos-realm-prod to repo.exordos.com
        if: github.ref == 'refs/heads/master' && matrix.variant == 'prod'
        env:
          PUSH_EXORDOS_CFG: ${{ secrets.PUSH_EXORDOS_CFG }}
          PUSH_CFG: ${{ secrets.PUSH_CFG }}
        run: |
          echo "$PUSH_CFG" | base64 -d > exordos/exordos.push.yaml
          exordos push -c exordos/exordos.push.yaml -t local -f --latest
      - name: Publish exordos-realm-dev to repo.exordos.com
        if: github.ref != 'refs/heads/master' && matrix.variant == 'dev'
        env:
          PUSH_CFG: ${{ secrets.PUSH_CFG }}
        run: |
          echo "$PUSH_CFG" | base64 -d > exordos/exordos.push.yaml
          exordos push -c exordos/exordos.push.yaml -t local -f