name: packer

on:
  push:
  workflow_dispatch:
  schedule:
    # Generate new release at 00:00 on Sunday.
    - cron: "0 0 * * 0"

env:
  PACKER_VERSION: "latest"
  # Exordos core element version baked into the image
  # (empty = latest stable in the public repo).
  CORE_VERSION: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build ${{ matrix.variant }} image
    strategy:
      fail-fast: false
      matrix:
        include:
          # Production node image used by the ecosystem builder (no console).
          - variant: prod
            dev_access: ""
            artifact_base: exordos-realm
          # Developer stand: DEV_ACCESS=1 enables ubuntu:ubuntu access.
          - variant: dev
            dev_access: "1"
            artifact_base: exordos-realm-dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup `packer`
        uses: hashicorp/setup-packer@main
        with:
          version: ${{ env.PACKER_VERSION }}
      - name: Set up QEMU
        run: |
          sudo apt -y update
          sudo apt install -y qemu-system-amd64 qemu-kvm qemu-utils libvirt-daemon-system libvirt-dev mkisofs zip zstd
          sudo adduser $USER libvirt
          sudo adduser $USER kvm
          sudo chmod +666 /dev/kvm
      - name: Build image
        env:
          DEV_ACCESS: ${{ matrix.dev_access }}
        run: |
          ./build.sh
      - name: Collect artifacts
        env:
          ARTIFACT_BASE: ${{ matrix.artifact_base }}
        run: |
          mkdir ./packed
          RAW_ZST=$(find output -name 'exordos-realm.raw.zst' | head -1)
          cp "$RAW_ZST" "./packed/${ARTIFACT_BASE}.raw.zst"
          # qcow2 for manual/developer usage
          zstd -d "./packed/${ARTIFACT_BASE}.raw.zst" -o "./packed/${ARTIFACT_BASE}.raw"
          qemu-img convert -O qcow2 "./packed/${ARTIFACT_BASE}.raw" "./packed/${ARTIFACT_BASE}.qcow2"
          rm "./packed/${ARTIFACT_BASE}.raw"
          zstd -19 -T0 --rm "./packed/${ARTIFACT_BASE}.qcow2"
          # Show image sizes
          ls -la ./packed/
      - name: Save build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_base }}
          path: ./packed/*
          compression-level: 0

  publish:
    name: Publish images
    needs: build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./packed
          merge-multiple: true
      - name: Set current date as env variable
        id: date
        run: |
          r=$(date -u +'%Y.%m.%d')
          echo "DATE=$r" >> $GITHUB_OUTPUT
      - name: Publish images
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ./packed/*
          tag: ${{ github.ref }}
          release_name: ${{ steps.date.outputs.DATE }}
          overwrite: true
          file_glob: true
